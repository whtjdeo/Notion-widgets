<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">

<title>Minimal Weather</title>

<style>
:root {
    --page-bg: #191919;

    --card-bg: rgba(255, 255, 255, 0.045);
    --card-border: rgba(255, 255, 255, 0.09);

    --text: rgba(255, 255, 255, 0.96);
    --sub: rgba(255, 255, 255, 0.66);
    --muted: rgba(255, 255, 255, 0.42);

    --icon: rgba(255, 255, 255, 0.94);
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: var(--page-bg) !important;

    overflow: hidden;
    color-scheme: dark;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;

    padding: 5px;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
}


/* =========================
   카드
========================= */

.weather {
    width: min(720px, 100%);

    padding: 22px 24px 16px;

    background: var(--card-bg);

    border:
        1px solid
        var(--card-border);

    border-radius: 26px;

    color: var(--text);

    contain: layout paint style;
}


/* =========================
   현재 날씨
========================= */

.current {
    display: grid;

    grid-template-columns:
        150px
        1fr;

    align-items: center;

    min-height: 112px;
}


/* 아이콘 영역 */

.current-weather {
    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;
}

.current-icon {
    width: 66px;
    height: 66px;
}

.condition {
    margin-top: 6px;

    font-size: 13px;
    font-weight: 600;

    color: var(--sub);
}


/* 온도 영역 */

.current-info {
    display: flex;

    align-items: center;
    justify-content: space-between;

    padding-left: 18px;
}

.temperature {
    font-size: 70px;

    font-weight: 200;

    line-height: 1;

    letter-spacing: -4px;
}

.side-info {
    text-align: right;
}

.location {
    font-size: 12px;

    color: var(--muted);

    margin-bottom: 9px;
}

.high-low {
    font-size: 13px;

    line-height: 1.65;

    color: var(--sub);
}

.high-low strong {
    color: var(--text);

    font-weight: 600;
}


/* =========================
   시간대별
========================= */

.hourly {
    display: grid;

    grid-template-columns:
        repeat(6, 1fr);

    gap: 4px;

    margin-top: 13px;
    padding-top: 15px;

    border-top:
        1px solid
        rgba(255, 255, 255, 0.075);
}

.hour {
    text-align: center;

    min-width: 0;
}

.hour-time {
    font-size: 10px;

    color: var(--muted);

    white-space: nowrap;
}

.hour-icon {
    width: 35px;
    height: 35px;

    margin:
        7px auto
        4px;
}

.hour-temp {
    font-size: 13px;

    font-weight: 600;

    color: var(--text);
}


/* =========================
   하단 정보
========================= */

.details {
    display: flex;

    justify-content: space-between;

    margin-top: 14px;
    padding-top: 11px;

    border-top:
        1px solid
        rgba(255, 255, 255, 0.075);

    color: var(--muted);

    font-size: 10px;
}

.details strong {
    color: var(--sub);

    font-weight: 600;
}


/* =========================
   SVG 공통
========================= */

.wx-icon {
    width: 100%;
    height: 100%;

    fill: none;

    stroke: var(--icon);

    stroke-width: 2.5;

    stroke-linecap: round;
    stroke-linejoin: round;

    display: block;
}


/* =========================
   오류
========================= */

#error {
    display: none;

    margin-top: 10px;

    text-align: center;

    font-size: 11px;

    color: rgba(255, 180, 180, 0.85);
}


/* =========================
   좁은 임베드 대응
========================= */

@media (max-width: 540px) {

    .weather {
        padding:
            18px
            16px
            14px;

        border-radius: 22px;
    }

    .current {
        grid-template-columns:
            112px
            1fr;
    }

    .current-icon {
        width: 55px;
        height: 55px;
    }

    .temperature {
        font-size: 58px;
    }

    .current-info {
        padding-left: 10px;
    }

    .hour-time {
        font-size: 9px;
    }

    .hour-icon {
        width: 29px;
        height: 29px;
    }

    .hour-temp {
        font-size: 11px;
    }
}
</style>
</head>


<body>

<div class="weather">

    <!-- 현재 날씨 -->
    <div class="current">

        <div class="current-weather">

            <div
                id="currentIcon"
                class="current-icon">
            </div>

            <div
                id="condition"
                class="condition">
                날씨
            </div>

        </div>


        <div class="current-info">

            <div class="temperature">
                <span id="temperature">--</span>°
            </div>


            <div class="side-info">

                <div
                    id="location"
                    class="location">
                    대전
                </div>

                <div class="high-low">

                    최고
                    <strong>
                        <span id="high">--</span>°
                    </strong>

                    <br>

                    최저
                    <strong>
                        <span id="low">--</span>°
                    </strong>

                </div>

            </div>

        </div>

    </div>


    <!-- 시간대별 날씨 -->
    <div
        id="hourly"
        class="hourly">
    </div>


    <!-- 세부 정보 -->
    <div class="details">

        <span>
            체감
            <strong>
                <span id="feels">--</span>°
            </strong>
        </span>

        <span>
            습도
            <strong>
                <span id="humidity">--</span>%
            </strong>
        </span>

        <span>
            바람
            <strong>
                <span id="wind">--</span> km/h
            </strong>
        </span>

    </div>


    <div id="error">
        날씨 정보를 불러오지 못했습니다.
    </div>

</div>


<script>

/* ==========================================
   지역
========================================== */

const CONFIG = {
    city: "대전",
    latitude: 36.3504,
    longitude: 127.3845
};


/* ==========================================
   한국어 날씨
========================================== */

const WEATHER_TEXT = {

    0: "맑음",

    1: "대체로 맑음",
    2: "구름 조금",
    3: "흐림",

    45: "안개",
    48: "짙은 안개",

    51: "약한 이슬비",
    53: "이슬비",
    55: "강한 이슬비",

    61: "약한 비",
    63: "비",
    65: "강한 비",

    71: "약한 눈",
    73: "눈",
    75: "강한 눈",
    77: "싸락눈",

    80: "소나기",
    81: "소나기",
    82: "강한 소나기",

    85: "눈소나기",
    86: "강한 눈소나기",

    95: "뇌우",
    96: "뇌우",
    99: "강한 뇌우"
};


/* ==========================================
   아이콘 디자인
========================================== */

function iconSvg(
    code,
    isDay = 1
) {

    /*
        맑음 - 낮
    */

    const sun = `
        <svg
            class="wx-icon"
            viewBox="0 0 64 64">

            <circle
                cx="32"
                cy="32"
                r="11"/>

            <path d="M32 7v8"/>
            <path d="M32 49v8"/>

            <path d="M7 32h8"/>
            <path d="M49 32h8"/>

            <path d="M14.5 14.5l5.7 5.7"/>
            <path d="M43.8 43.8l5.7 5.7"/>

            <path d="M49.5 14.5l-5.7 5.7"/>
            <path d="M20.2 43.8l-5.7 5.7"/>

        </svg>
    `;


    /*
        맑음 - 밤
    */

    const moon = `
        <svg
            class="wx-icon"
            viewBox="0 0 64 64">

            <path
                d="
                    M42 13
                    C31 15 23 24 23 35
                    C23 46 32 54 43 54
                    C48 54 52 52 55 49
                    C52 50 49 50 46 50
                    C35 50 27 42 27 32
                    C27 23 33 16 42 13
                    Z
                "/>

            <path
                d="
                    M49 15
                    v6
                    M46 18
                    h6
                "/>

        </svg>
    `;


    /*
        구름
    */

    const cloud = `
        <svg
            class="wx-icon"
            viewBox="0 0 64 64">

            <path
                d="
                    M18 44
                    H47
                    C54 44 58 40 58 34
                    C58 28 53 24 47 24
                    C44 17 38 14 31 15
                    C23 16 18 22 18 29
                    C11 29 7 33 7 38
                    C7 42 11 44 18 44
                    Z
                "/>

        </svg>
    `;


    /*
        낮 + 구름
    */

    const partlyDay = `
        <svg
            class="wx-icon"
            viewBox="0 0 64 64">

            <circle
                cx="23"
                cy="22"
                r="9"/>

            <path d="M23 6v6"/>
            <path d="M7 22h6"/>

            <path d="M12 11l4 4"/>
            <path d="M34 11l-4 4"/>

            <path
                d="
                    M19 48
                    H48
                    C54 48 58 44 58 39
                    C58 34 54 30 49 30
                    C46 24 40 22 35 23
                    C28 24 24 29 24 35
                    C18 35 14 38 14 42
                    C14 46 16 48 19 48
                    Z
                "/>

        </svg>
    `;


    /*
        밤 + 구름
    */

    const partlyNight = `
        <svg
            class="wx-icon"
            viewBox="0 0 64 64">

            <path
                d="
                    M30 9
                    C22 12 17 19 17 27
                    C17 34 21 39 27 42
                    C23 37 22 32 23 28
                    C24 19 27 13 30 9
                    Z
                "/>

            <path
                d="
                    M39 12
                    v5
                    M36.5 14.5
                    h5
                "/>

            <path
                d="
                    M21 49
                    H48
                    C54 49 58 45 58 40
                    C58 35 54 31 49 31
                    C46 26 41 24 36 25
                    C30 26 26 31 26 36
                    C20 36 16 39 16 43
                    C16 47 18 49 21 49
                    Z
                "/>

        </svg>
    `;


    /*
        비
    */

    const rain = `
        <svg
            class="wx-icon"
            viewBox="0 0 64 64">

            <path
                d="
                    M18 38
                    H47
                    C54 38 58 34 58 29
                    C58 24 54 20 48 20
                    C45 14 39 12 33 13
                    C25 14 21 20 21 26
                    C14 26 10 30 10 34
                    C10 37 13 38 18 38
                    Z
                "/>

            <path d="M22 46l-4 7"/>
            <path d="M34 46l-4 7"/>
            <path d="M46 46l-4 7"/>

        </svg>
    `;


    /*
        강한 비
    */

    const heavyRain = `
        <svg
            class="wx-icon"
            viewBox="0 0 64 64">

            <path
                d="
                    M18 36
                    H47
                    C54 36 58 32 58 27
                    C58 22 54 18 48 18
                    C45 12 39 10 33 11
                    C25 12 21 18 21 24
                    C14 24 10 28 10 32
                    C10 35 13 36 18 36
                    Z
                "/>

            <path d="M18 44l-5 8"/>
            <path d="M29 44l-5 8"/>
            <path d="M40 44l-5 8"/>
            <path d="M51 44l-5 8"/>

        </svg>
    `;


    /*
        안개
    */

    const fog = `
        <svg
            class="wx-icon"
            viewBox="0 0 64 64">

            <path d="M13 21h38"/>
            <path d="M20 30h35"/>
            <path d="M9 39h38"/>
            <path d="M18 48h32"/>

        </svg>
    `;


    /*
        눈
    */

    const snow = `
        <svg
            class="wx-icon"
            viewBox="0 0 64 64">

            <path
                d="
                    M18 36
                    H47
                    C54 36 58 32 58 27
                    C58 22 54 18 48 18
                    C45 12 39 10 33 11
                    C25 12 21 18 21 24
                    C14 24 10 28 10 32
                    C10 35 13 36 18 36
                    Z
                "/>

            <path d="M21 47v8"/>
            <path d="M17 51h8"/>

            <path d="M35 44v8"/>
            <path d="M31 48h8"/>

            <path d="M49 47v8"/>
            <path d="M45 51h8"/>

        </svg>
    `;


    /*
        뇌우
    */

    const storm = `
        <svg
            class="wx-icon"
            viewBox="0 0 64 64">

            <path
                d="
                    M18 36
                    H47
                    C54 36 58 32 58 27
                    C58 22 54 18 48 18
                    C45 12 39 10 33 11
                    C25 12 21 18 21 24
                    C14 24 10 28 10 32
                    C10 35 13 36 18 36
                    Z
                "/>

            <path
                d="
                    M35 41
                    L29 50
                    H35
                    L31 58
                    L43 47
                    H37
                    L42 41
                    Z
                "/>

        </svg>
    `;


    /*
        날씨 코드 → 아이콘
    */

    if(code === 0){
        return isDay
            ? sun
            : moon;
    }


    if(
        code === 1 ||
        code === 2
    ){
        return isDay
            ? partlyDay
            : partlyNight;
    }


    if(code === 3){
        return cloud;
    }


    if(
        code === 45 ||
        code === 48
    ){
        return fog;
    }


    if(
        [
            51,
            53,
            55,
            61,
            63
        ].includes(code)
    ){
        return rain;
    }


    if(
        [
            65,
            80,
            81,
            82
        ].includes(code)
    ){
        return heavyRain;
    }


    if(
        [
            71,
            73,
            75,
            77,
            85,
            86
        ].includes(code)
    ){
        return snow;
    }


    if(
        [
            95,
            96,
            99
        ].includes(code)
    ){
        return storm;
    }


    return cloud;
}


/* ==========================================
   보조 함수
========================================== */

function round(value){
    return Math.round(
        Number(value)
    );
}


function hourLabel(timeString){

    const hour =
        Number(
            timeString.slice(
                11,
                13
            )
        );


    if(hour === 0){
        return "오전 12시";
    }


    if(hour < 12){
        return `오전 ${hour}시`;
    }


    if(hour === 12){
        return "오후 12시";
    }


    return `오후 ${hour - 12}시`;
}


/* ==========================================
   API
========================================== */

async function loadWeather(){

    const url =
        `https://api.open-meteo.com/v1/forecast` +

        `?latitude=${CONFIG.latitude}` +

        `&longitude=${CONFIG.longitude}` +

        `&current=` +
        `temperature_2m,` +
        `apparent_temperature,` +
        `relative_humidity_2m,` +
        `weather_code,` +
        `wind_speed_10m,` +
        `is_day` +

        `&hourly=` +
        `temperature_2m,` +
        `weather_code,` +
        `is_day` +

        `&daily=` +
        `temperature_2m_max,` +
        `temperature_2m_min` +

        `&timezone=Asia%2FSeoul` +

        `&forecast_days=2`;


    try{

        const response =
            await fetch(url);


        if(!response.ok){
            throw new Error(
                "Weather API error"
            );
        }


        const data =
            await response.json();


        const current =
            data.current;


        /* 현재 날씨 */

        document
            .getElementById(
                "temperature"
            )
            .textContent =
            round(
                current.temperature_2m
            );


        document
            .getElementById(
                "condition"
            )
            .textContent =
            WEATHER_TEXT[
                current.weather_code
            ] || "날씨";


        document
            .getElementById(
                "currentIcon"
            )
            .innerHTML =
            iconSvg(
                current.weather_code,
                current.is_day
            );


        document
            .getElementById(
                "location"
            )
            .textContent =
            CONFIG.city;


        /* 최고 / 최저 */

        document
            .getElementById("high")
            .textContent =
            round(
                data.daily
                    .temperature_2m_max[0]
            );


        document
            .getElementById("low")
            .textContent =
            round(
                data.daily
                    .temperature_2m_min[0]
            );


        /* 상세 정보 */

        document
            .getElementById("feels")
            .textContent =
            round(
                current.apparent_temperature
            );


        document
            .getElementById("humidity")
            .textContent =
            round(
                current.relative_humidity_2m
            );


        document
            .getElementById("wind")
            .textContent =
            round(
                current.wind_speed_10m
            );


        /* 현재 시간 기준 index */

        const currentHourString =
            current.time.slice(
                0,
                13
            ) + ":00";


        let startIndex =
            data.hourly.time.indexOf(
                currentHourString
            );


        if(startIndex < 0){
            startIndex = 0;
        }


        /* 시간대별 */

        const hourly =
            document
                .getElementById(
                    "hourly"
                );


        hourly.innerHTML = "";


        const fragment =
            document
                .createDocumentFragment();


        for(
            let i = 0;
            i < 6;
            i++
        ){

            const index =
                startIndex + i;


            if(
                index >=
                data.hourly.time.length
            ){
                break;
            }


            const item =
                document
                    .createElement(
                        "div"
                    );


            item.className =
                "hour";


            const label =
                i === 0
                    ? "지금"
                    : hourLabel(
                        data.hourly
                            .time[index]
                    );


            item.innerHTML = `

                <div class="hour-time">
                    ${label}
                </div>

                <div class="hour-icon">

                    ${iconSvg(
                        data.hourly
                            .weather_code[index],

                        data.hourly
                            .is_day[index]
                    )}

                </div>

                <div class="hour-temp">

                    ${round(
                        data.hourly
                            .temperature_2m[index]
                    )}°

                </div>

            `;


            fragment.appendChild(
                item
            );

        }


        hourly.appendChild(
            fragment
        );


        document
            .getElementById(
                "error"
            )
            .style
            .display =
            "none";

    }


    catch(error){

        console.error(error);


        document
            .getElementById(
                "error"
            )
            .style
            .display =
            "block";

    }

}


/* 처음 한 번 */

loadWeather();


/* 30분마다 갱신 */

setInterval(
    loadWeather,
    30 * 60 * 1000
);

</script>

</body>
</html>
