<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Glass Weather Widget</title>

<style>
:root{
    --glass-bg-1: rgba(84, 90, 103, 0.58);
    --glass-bg-2: rgba(49, 55, 67, 0.52);

    --border: rgba(255,255,255,0.14);

    --text: rgba(255,255,255,0.98);
    --sub: rgba(255,255,255,0.72);
    --muted: rgba(255,255,255,0.52);

    --sun: #ffc21c;
}

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;

    margin:0;

    background:transparent;

    overflow:hidden;
}

body{
    display:flex;

    justify-content:center;
    align-items:center;

    padding:8px;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
}

/* ================================
   전체 위젯
================================ */

.widget{
    width:min(760px, 100%);

    padding:20px 24px 17px;

    color:var(--text);

    background:
        linear-gradient(
            145deg,
            var(--glass-bg-1),
            var(--glass-bg-2)
        );

    border:
        1px solid var(--border);

    border-radius:28px;

    backdrop-filter:
        blur(18px)
        saturate(115%);

    -webkit-backdrop-filter:
        blur(18px)
        saturate(115%);

    box-shadow:
        0 14px 34px
        rgba(0,0,0,0.17),

        inset 0 1px 0
        rgba(255,255,255,0.08);
}

/* ================================
   상단
================================ */

.top{
    display:flex;

    justify-content:space-between;
    align-items:flex-start;

    gap:20px;
}

/* 왼쪽 */

.left{
    min-width:160px;
}

.location{
    display:flex;

    align-items:center;

    gap:6px;

    color:var(--sub);

    font-size:12px;
    font-weight:600;
}

.location svg{
    width:13px;
    height:13px;

    fill:var(--sub);
}

.temp{
    margin-top:3px;

    font-size:68px;

    font-weight:300;

    line-height:0.95;

    letter-spacing:-4px;
}

.updated{
    margin-top:7px;

    color:var(--muted);

    font-size:11px;
}

/* 오른쪽 */

.right{
    display:flex;

    flex-direction:column;

    align-items:flex-end;
}

.current-icon{
    width:54px;
    height:54px;
}

.condition{
    margin-top:1px;

    font-size:15px;

    color:var(--sub);

    font-weight:600;
}

.highlow{
    margin-top:3px;

    font-size:14px;

    font-weight:600;
}

/* ================================
   시간대별
================================ */

.hourly{
    display:grid;

    grid-template-columns:
        repeat(6, 1fr);

    gap:4px;

    margin-top:17px;
}

.hour{
    min-width:0;

    text-align:center;
}

.hour-time{
    font-size:11px;

    color:var(--sub);

    white-space:nowrap;
}

.hour-icon{
    width:36px;
    height:36px;

    margin:
        6px auto
        3px;
}

.hour-temp{
    font-size:14px;

    font-weight:700;
}

/* ================================
   하단
================================ */

.bottom{
    display:flex;

    justify-content:space-between;

    gap:12px;

    margin-top:14px;

    padding-top:10px;

    border-top:
        1px solid
        rgba(255,255,255,0.11);

    color:var(--muted);

    font-size:11px;
}

.bottom strong{
    color:var(--sub);

    font-weight:600;
}

/* ================================
   SVG
================================ */

svg{
    display:block;
}

/* ================================
   오류
================================ */

#error{
    display:none;

    margin-top:10px;

    text-align:center;

    color:#ffd5d5;

    font-size:11px;
}

/* ================================
   작은 화면
================================ */

@media(max-width:580px){

    body{
        padding:6px;
    }

    .widget{
        padding:
            17px
            16px
            14px;

        border-radius:24px;
    }

    .temp{
        font-size:56px;
    }

    .current-icon{
        width:46px;
        height:46px;
    }

    .hourly{
        gap:2px;
    }

    .hour-time{
        font-size:10px;
    }

    .hour-icon{
        width:30px;
        height:30px;
    }

    .hour-temp{
        font-size:12px;
    }

    .bottom{
        font-size:10px;
    }
}
</style>
</head>

<body>

<div class="widget">

    <div class="top">

        <!-- 왼쪽 -->
        <div class="left">

            <div class="location">

                <svg viewBox="0 0 24 24">
                    <path
                    d="
                    M20.4 3.6
                    4.7 9.7
                    c-1.3.5-1.3 2.3.1 2.8
                    l5.5 1.9
                    1.9 5.5
                    c.5 1.4 2.3 1.4 2.8.1
                    L21 4.4
                    c.2-.6-.4-1.2-1-.8Z"/>
                </svg>

                <span id="city">
                    대전
                </span>

            </div>


            <div class="temp">
                <span id="temp">
                    --
                </span>°
            </div>


            <div
                class="updated"
                id="updated">

                날씨 불러오는 중...

            </div>

        </div>


        <!-- 오른쪽 -->
        <div class="right">

            <div
                id="currentIcon"
                class="current-icon">
            </div>

            <div
                id="condition"
                class="condition">
                --
            </div>

            <div class="highlow">

                최고:
                <span id="high">
                    --
                </span>°

                최저:
                <span id="low">
                    --
                </span>°

            </div>

        </div>

    </div>


    <!-- 시간대별 -->
    <div
        id="hourly"
        class="hourly">
    </div>


    <!-- 하단 -->
    <div class="bottom">

        <span>
            체감
            <strong>
                <span id="feels">
                    --
                </span>°
            </strong>
        </span>

        <span>
            습도
            <strong>
                <span id="humidity">
                    --
                </span>%
            </strong>
        </span>

        <span>
            바람
            <strong>
                <span id="wind">
                    --
                </span>
                km/h
            </strong>
        </span>

    </div>


    <div id="error">
        날씨 정보를 불러오지 못했습니다.
    </div>

</div>


<script>

/* ============================================
   지역 설정
============================================ */

const CONFIG = {

    city:
        "대전",

    latitude:
        36.3504,

    longitude:
        127.3845
};


/* ============================================
   날씨 이름
============================================ */

const WEATHER_TEXT = {

    0:
        "맑음",

    1:
        "대체로 맑음",

    2:
        "구름 조금",

    3:
        "흐림",

    45:
        "안개",

    48:
        "짙은 안개",

    51:
        "약한 이슬비",

    53:
        "이슬비",

    55:
        "강한 이슬비",

    61:
        "약한 비",

    63:
        "비",

    65:
        "강한 비",

    71:
        "약한 눈",

    73:
        "눈",

    75:
        "강한 눈",

    77:
        "싸락눈",

    80:
        "약한 소나기",

    81:
        "소나기",

    82:
        "강한 소나기",

    85:
        "약한 눈소나기",

    86:
        "강한 눈소나기",

    95:
        "뇌우",

    96:
        "우박 동반 뇌우",

    99:
        "강한 우박 동반 뇌우"
};


/* ============================================
   날씨 SVG 아이콘
============================================ */

function iconSvg(
    code,
    size = "100%"
){

    /* 맑음 */

    const sun = `

    <svg
        width="${size}"
        height="${size}"
        viewBox="0 0 64 64">

        <circle
            cx="32"
            cy="32"
            r="17"
            fill="#ffc21c"/>

    </svg>

    `;


    /* 흐림 */

    const cloud = `

    <svg
        width="${size}"
        height="${size}"
        viewBox="0 0 64 64">

        <g fill="#ffffff">

            <circle
                cx="27"
                cy="34"
                r="15"/>

            <circle
                cx="41"
                cy="36"
                r="12"/>

            <rect
                x="18"
                y="34"
                width="34"
                height="14"
                rx="7"/>

        </g>

    </svg>

    `;


    /* 구름 조금 */

    const partlyCloudy = `

    <svg
        width="${size}"
        height="${size}"
        viewBox="0 0 64 64">

        <circle
            cx="23"
            cy="23"
            r="14"
            fill="#ffc21c"/>

        <g fill="#ffffff">

            <circle
                cx="31"
                cy="37"
                r="13"/>

            <circle
                cx="44"
                cy="39"
                r="10"/>

            <rect
                x="22"
                y="37"
                width="31"
                height="13"
                rx="6.5"/>

        </g>

    </svg>

    `;


    /* 비 */

    const rain = `

    <svg
        width="${size}"
        height="${size}"
        viewBox="0 0 64 64">

        <g fill="#ffffff">

            <circle
                cx="27"
                cy="25"
                r="14"/>

            <circle
                cx="41"
                cy="27"
                r="11"/>

            <rect
                x="19"
                y="27"
                width="32"
                height="13"
                rx="6.5"/>

        </g>


        <g
            stroke="#ffffff"
            stroke-width="4.8"
            stroke-linecap="round">

            <line
                x1="20"
                y1="47"
                x2="15"
                y2="54"/>

            <line
                x1="33"
                y1="47"
                x2="28"
                y2="54"/>

            <line
                x1="46"
                y1="47"
                x2="41"
                y2="54"/>

        </g>

    </svg>

    `;


    /* 강한 비 */

    const heavyRain = `

    <svg
        width="${size}"
        height="${size}"
        viewBox="0 0 64 64">

        <g
            stroke="#ffffff"
            stroke-width="5"
            stroke-linecap="round">

            <line
                x1="16"
                y1="18"
                x2="10"
                y2="26"/>

            <line
                x1="30"
                y1="17"
                x2="24"
                y2="25"/>

            <line
                x1="44"
                y1="20"
                x2="38"
                y2="28"/>


            <line
                x1="23"
                y1="35"
                x2="17"
                y2="43"/>

            <line
                x1="37"
                y1="34"
                x2="31"
                y2="42"/>

            <line
                x1="51"
                y1="37"
                x2="45"
                y2="45"/>

        </g>

    </svg>

    `;


    /* 안개 */

    const fog = `

    <svg
        width="${size}"
        height="${size}"
        viewBox="0 0 64 64">

        <g
            stroke="#ffffff"
            stroke-width="5"
            stroke-linecap="round">

            <line
                x1="10"
                y1="22"
                x2="48"
                y2="22"/>

            <line
                x1="17"
                y1="32"
                x2="54"
                y2="32"/>

            <line
                x1="9"
                y1="42"
                x2="45"
                y2="42"/>

        </g>

    </svg>

    `;


    /* 눈 */

    const snow = `

    <svg
        width="${size}"
        height="${size}"
        viewBox="0 0 64 64">

        <g fill="#ffffff">

            <circle
                cx="27"
                cy="25"
                r="14"/>

            <circle
                cx="41"
                cy="27"
                r="11"/>

            <rect
                x="19"
                y="27"
                width="32"
                height="13"
                rx="6.5"/>

        </g>


        <g fill="#ffffff">

            <circle
                cx="20"
                cy="50"
                r="3"/>

            <circle
                cx="32"
                cy="55"
                r="3"/>

            <circle
                cx="45"
                cy="49"
                r="3"/>

        </g>

    </svg>

    `;


    /* 뇌우 */

    const storm = `

    <svg
        width="${size}"
        height="${size}"
        viewBox="0 0 64 64">

        <g fill="#ffffff">

            <circle
                cx="27"
                cy="24"
                r="14"/>

            <circle
                cx="41"
                cy="26"
                r="11"/>

            <rect
                x="19"
                y="26"
                width="32"
                height="13"
                rx="6.5"/>

        </g>


        <path
            fill="#ffc21c"

            d="
            M34 38
            H43
            L35 48
            H42
            L27 61
            L32 51
            H25
            Z"/>

    </svg>

    `;


    /* 날씨 코드 매핑 */

    if(
        code === 0
    ){
        return sun;
    }


    if(
        code === 1 ||
        code === 2
    ){
        return partlyCloudy;
    }


    if(
        code === 3
    ){
        return cloud;
    }


    if(
        code === 45 ||
        code === 48
    ){
        return fog;
    }


    if(
        [
            51,
            53,
            55,
            61,
            63
        ]
        .includes(code)
    ){
        return rain;
    }


    if(
        [
            65,
            80,
            81,
            82
        ]
        .includes(code)
    ){
        return heavyRain;
    }


    if(
        [
            71,
            73,
            75,
            77,
            85,
            86
        ]
        .includes(code)
    ){
        return snow;
    }


    if(
        [
            95,
            96,
            99
        ]
        .includes(code)
    ){
        return storm;
    }


    return cloud;
}


/* ============================================
   숫자 반올림
============================================ */

function round(value){

    return Math.round(
        Number(value)
    );

}


/* ============================================
   시간 표현
============================================ */

function hourText(iso){

    const date =
        new Date(iso);

    const hour =
        date.getHours();


    if(hour === 0){

        return "오전 12시";

    }


    if(hour < 12){

        return `오전 ${hour}시`;

    }


    if(hour === 12){

        return "오후 12시";

    }


    return `오후 ${hour - 12}시`;

}


/* ============================================
   날씨 요청
============================================ */

async function loadWeather(){

    const url =

        `https://api.open-meteo.com/v1/forecast` +

        `?latitude=${CONFIG.latitude}` +

        `&longitude=${CONFIG.longitude}` +

        `&current=` +

        `temperature_2m,` +

        `apparent_temperature,` +

        `relative_humidity_2m,` +

        `weather_code,` +

        `wind_speed_10m` +

        `&hourly=` +

        `temperature_2m,` +

        `weather_code` +

        `&daily=` +

        `temperature_2m_max,` +

        `temperature_2m_min` +

        `&timezone=Asia%2FSeoul` +

        `&forecast_days=2`;


    try{

        const response =
            await fetch(url);


        if(
            !response.ok
        ){

            throw new Error(
                "Weather API error"
            );

        }


        const data =
            await response.json();


        const current =
            data.current;


        /* 현재 날씨 */

        document
            .getElementById("city")
            .textContent =
            CONFIG.city;


        document
            .getElementById("temp")
            .textContent =
            round(
                current.temperature_2m
            );


        document
            .getElementById("condition")
            .textContent =
            WEATHER_TEXT[
                current.weather_code
            ]
            || "날씨";


        document
            .getElementById(
                "currentIcon"
            )
            .innerHTML =
            iconSvg(
                current.weather_code
            );


        /* 최고 / 최저 */

        document
            .getElementById("high")
            .textContent =
            round(
                data
                .daily
                .temperature_2m_max[0]
            );


        document
            .getElementById("low")
            .textContent =
            round(
                data
                .daily
                .temperature_2m_min[0]
            );


        /* 부가 정보 */

        document
            .getElementById("feels")
            .textContent =
            round(
                current
                .apparent_temperature
            );


        document
            .getElementById("humidity")
            .textContent =
            round(
                current
                .relative_humidity_2m
            );


        document
            .getElementById("wind")
            .textContent =
            round(
                current
                .wind_speed_10m
            );


        /* 업데이트 시간 */

        const now =
            new Date();


        const period =
            now.getHours() < 12
            ? "오전"
            : "오후";


        const hour12 =
            ((now.getHours() + 11) % 12)
            + 1;


        document
            .getElementById("updated")
            .textContent =
            `${period} ${hour12}시`;


        /* 시간대별 날씨 */

        const hourStart =
            new Date();


        hourStart.setMinutes(
            0,
            0,
            0
        );


        let startIndex =
            data.hourly.time.findIndex(

                time =>
                    new Date(time)
                    >= hourStart

            );


        if(
            startIndex < 0
        ){

            startIndex = 0;

        }


        const hourly =
            document
            .getElementById("hourly");


        hourly.innerHTML = "";


        for(
            let i = 0;
            i < 6;
            i++
        ){

            const index =
                startIndex + i;


            if(
                index
                >=
                data.hourly.time.length
            ){

                break;

            }


            const item =
                document
                .createElement("div");


            item.className =
                "hour";


            item.innerHTML = `

                <div class="hour-time">

                    ${
                        i === 0
                        ? "지금"
                        :
                        hourText(
                            data
                            .hourly
                            .time[index]
                        )
                    }

                </div>


                <div class="hour-icon">

                    ${
                        iconSvg(
                            data
                            .hourly
                            .weather_code[index]
                        )
                    }

                </div>


                <div class="hour-temp">

                    ${
                        round(
                            data
                            .hourly
                            .temperature_2m[index]
                        )
                    }°

                </div>

            `;


            hourly.appendChild(
                item
            );

        }


        document
            .getElementById("error")
            .style
            .display =
            "none";

    }

    catch(error){

        document
            .getElementById("error")
            .style
            .display =
            "block";

    }

}


/* ============================================
   최초 실행
============================================ */

loadWeather();


/* ============================================
   30분마다 갱신
============================================ */

setInterval(

    loadWeather,

    30 * 60 * 1000

);

</script>

</body>
</html>
