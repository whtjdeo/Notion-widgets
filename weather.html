<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Weather Widget</title>

<style>
:root{
    --page-bg:#191919;

    --card-bg-top:rgba(255,255,255,0.14);
    --card-bg-bottom:rgba(255,255,255,0.07);
    --card-border:rgba(255,255,255,0.12);

    --text-main:rgba(255,255,255,0.98);
    --text-sub:rgba(255,255,255,0.74);
    --text-muted:rgba(255,255,255,0.48);

    --yellow:#ffc21c;
    --white:#ffffff;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#191919 !important;
    background-color:#191919 !important;
    overflow:hidden;
    color-scheme:dark;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:6px;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
}

.widget{
    width:min(760px,100%);
    padding:19px 22px 15px;
    color:var(--text-main);

    background:
        linear-gradient(
            145deg,
            var(--card-bg-top),
            var(--card-bg-bottom)
        );

    border:1px solid var(--card-border);
    border-radius:28px;

    box-shadow:
        0 6px 16px rgba(0,0,0,0.20);

    contain:layout paint style;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
}

.left{
    min-width:155px;
}

.location{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--text-sub);
    font-size:12px;
    font-weight:600;
}

.location svg{
    width:13px;
    height:13px;
    fill:currentColor;
}

.current-temp{
    margin-top:4px;
    font-size:66px;
    font-weight:300;
    line-height:0.95;
    letter-spacing:-4px;
}

.updated{
    margin-top:7px;
    color:var(--text-muted);
    font-size:11px;
}

.right{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
}

.current-icon{
    width:54px;
    height:54px;
}

.condition{
    margin-top:2px;
    color:var(--text-sub);
    font-size:15px;
    font-weight:600;
}

.high-low{
    margin-top:3px;
    font-size:14px;
    font-weight:600;
}

.hourly{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:3px;
    margin-top:17px;
}

.hour{
    min-width:0;
    text-align:center;
}

.hour-time{
    color:var(--text-sub);
    font-size:11px;
    white-space:nowrap;
}

.hour-icon{
    width:34px;
    height:34px;
    margin:6px auto 3px;
}

.hour-temp{
    font-size:13px;
    font-weight:700;
}

.bottom{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:14px;
    padding-top:10px;
    border-top:1px solid rgba(255,255,255,0.10);
    color:var(--text-muted);
    font-size:11px;
}

.bottom strong{
    color:var(--text-sub);
    font-weight:600;
}

svg{
    display:block;
    width:100%;
    height:100%;
}

#error{
    display:none;
    margin-top:9px;
    color:#ffd3d3;
    font-size:11px;
    text-align:center;
}

@media (max-width:580px){
    body{
        padding:3px;
    }

    .widget{
        padding:16px 15px 13px;
        border-radius:23px;
    }

    .current-temp{
        font-size:55px;
    }

    .current-icon{
        width:45px;
        height:45px;
    }

    .hour-time{
        font-size:10px;
    }

    .hour-icon{
        width:29px;
        height:29px;
    }

    .hour-temp{
        font-size:12px;
    }

    .bottom{
        font-size:10px;
    }
}
</style>
</head>

<body>

<div class="widget">

    <div class="top">
        <div class="left">

            <div class="location">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20.4 3.6 4.7 9.7c-1.3.5-1.3 2.3.1 2.8l5.5 1.9 1.9 5.5c.5 1.4 2.3 1.4 2.8.1L21 4.4c.2-.6-.4-1.2-1-.8Z"/>
                </svg>
                <span id="city">대전</span>
            </div>

            <div class="current-temp">
                <span id="temp">--</span>°
            </div>

            <div id="updated" class="updated">날씨 불러오는 중...</div>
        </div>

        <div class="right">
            <div id="currentIcon" class="current-icon"></div>
            <div id="condition" class="condition">--</div>

            <div class="high-low">
                최고:<span id="high">--</span>°
                최저:<span id="low">--</span>°
            </div>
        </div>
    </div>

    <div id="hourly" class="hourly"></div>

    <div class="bottom">
        <span>체감 <strong><span id="feels">--</span>°</strong></span>
        <span>습도 <strong><span id="humidity">--</span>%</strong></span>
        <span>바람 <strong><span id="wind">--</span> km/h</strong></span>
    </div>

    <div id="error">날씨 정보를 불러오지 못했습니다.</div>
</div>

<script>
const CONFIG = {
    city: "대전",
    latitude: 36.3504,
    longitude: 127.3845
};

const WEATHER_TEXT = {
    0: "맑음",
    1: "대체로 맑음",
    2: "구름 조금",
    3: "흐림",
    45: "안개",
    48: "짙은 안개",
    51: "약한 이슬비",
    53: "이슬비",
    55: "강한 이슬비",
    61: "약한 비",
    63: "비",
    65: "강한 비",
    71: "약한 눈",
    73: "눈",
    75: "강한 눈",
    77: "싸락눈",
    80: "약한 소나기",
    81: "소나기",
    82: "강한 소나기",
    85: "약한 눈소나기",
    86: "강한 눈소나기",
    95: "뇌우",
    96: "우박 동반 뇌우",
    99: "강한 우박 동반 뇌우"
};

function iconSvg(code, isDay = 1) {

    const sun = `
    <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="15" fill="#ffc21c"/>
    </svg>`;

    const moon = `
    <svg viewBox="0 0 64 64" aria-hidden="true">
        <path fill="#ffffff"
            d="M39 11c-9 2-15 10-15 20 0 12 9 21 21 21 3 0 6-.5 8.5-2-2.3.4-4.1.4-5.7.2-10.9-1.1-18.8-10-18.8-20.7 0-8.1 4.6-15.1 10.9-18.5Z"/>
        <circle cx="47" cy="18" r="2.2" fill="#ffffff"/>
    </svg>`;

    const cloud = `
    <svg viewBox="0 0 64 64" aria-hidden="true">
        <g fill="#ffffff">
            <circle cx="26" cy="35" r="11.5"/>
            <circle cx="38" cy="31" r="13"/>
            <circle cx="48" cy="36" r="9"/>
            <rect x="18" y="35" width="38" height="11" rx="5.5"/>
        </g>
    </svg>`;

    const partlyDay = `
    <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="22" cy="22" r="12.5" fill="#ffc21c"/>
        <g fill="#ffffff">
            <circle cx="30" cy="39" r="10.5"/>
            <circle cx="41" cy="35" r="12"/>
            <circle cx="50" cy="39" r="8"/>
            <rect x="22" y="39" width="35" height="10" rx="5"/>
        </g>
    </svg>`;

    const partlyNight = `
    <svg viewBox="0 0 64 64" aria-hidden="true">
        <path fill="#ffffff"
            d="M29 10c-7 2.2-12 8.5-12 16.2 0 5.5 2.5 10.2 6.6 13-1.4-2.4-2.1-5-2.1-8 0-8.2 4.8-15.5 11.5-18.8Z"/>
        <circle cx="41" cy="17" r="1.9" fill="#ffffff"/>
        <g fill="#ffffff">
            <circle cx="33" cy="40" r="10"/>
            <circle cx="44" cy="37" r="11.5"/>
            <circle cx="52" cy="40" r="7.5"/>
            <rect x="25" y="40" width="34" height="10" rx="5"/>
        </g>
    </svg>`;

    const rain = `
    <svg viewBox="0 0 64 64" aria-hidden="true">
        <g fill="#ffffff">
            <circle cx="26" cy="28" r="10.5"/>
            <circle cx="38" cy="25" r="12"/>
            <circle cx="48" cy="29" r="8.5"/>
            <rect x="18" y="29" width="37" height="10" rx="5"/>
        </g>
        <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
            <line x1="21" y1="45" x2="17" y2="51"/>
            <line x1="33" y1="45" x2="29" y2="51"/>
            <line x1="45" y1="45" x2="41" y2="51"/>
        </g>
    </svg>`;

    const heavyRain = `
    <svg viewBox="0 0 64 64" aria-hidden="true">
        <g stroke="#ffffff" stroke-width="4.6" stroke-linecap="round">
            <line x1="14" y1="17" x2="9" y2="24"/>
            <line x1="27" y1="15" x2="22" y2="22"/>
            <line x1="40" y1="18" x2="35" y2="25"/>
            <line x1="22" y1="33" x2="17" y2="40"/>
            <line x1="35" y1="31" x2="30" y2="38"/>
            <line x1="48" y1="34" x2="43" y2="41"/>
        </g>
    </svg>`;

    const fog = `
    <svg viewBox="0 0 64 64" aria-hidden="true">
        <g stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.98">
            <line x1="13" y1="22" x2="30" y2="22"/>
            <line x1="23" y1="31" x2="48" y2="31"/>
            <line x1="11" y1="40" x2="36" y2="40"/>
            <line x1="40" y1="22" x2="52" y2="22"/>
            <line x1="44" y1="40" x2="54" y2="40"/>
        </g>
    </svg>`;

    const snow = `
    <svg viewBox="0 0 64 64" aria-hidden="true">
        <g fill="#ffffff">
            <circle cx="26" cy="28" r="10.5"/>
            <circle cx="38" cy="25" r="12"/>
            <circle cx="48" cy="29" r="8.5"/>
            <rect x="18" y="29" width="37" height="10" rx="5"/>
        </g>
        <g fill="#ffffff">
            <circle cx="21" cy="49" r="2.6"/>
            <circle cx="33" cy="53" r="2.6"/>
            <circle cx="45" cy="48" r="2.6"/>
        </g>
    </svg>`;

    const storm = `
    <svg viewBox="0 0 64 64" aria-hidden="true">
        <g fill="#ffffff">
            <circle cx="26" cy="28" r="10.5"/>
            <circle cx="38" cy="25" r="12"/>
            <circle cx="48" cy="29" r="8.5"/>
            <rect x="18" y="29" width="37" height="10" rx="5"/>
        </g>
        <path fill="#ffc21c"
            d="M33 40h9l-7 9h7L28 61l4-10h-7z"/>
    </svg>`;

    if (code === 0) return isDay ? sun : moon;
    if (code === 1 || code === 2) return isDay ? partlyDay : partlyNight;
    if (code === 3) return cloud;
    if (code === 45 || code === 48) return fog;
    if ([51,53,55,61,63].includes(code)) return rain;
    if ([65,80,81,82].includes(code)) return heavyRain;
    if ([71,73,75,77,85,86].includes(code)) return snow;
    if ([95,96,99].includes(code)) return storm;

    return cloud;
}

function round(v){
    return Math.round(Number(v));
}

function hourText(iso){
    const d = new Date(iso);
    const h = d.getHours();

    if(h === 0) return "오전 12시";
    if(h < 12) return `오전 ${h}시`;
    if(h === 12) return "오후 12시";
    return `오후 ${h - 12}시`;
}

async function loadWeather(){

    const url =
        `https://api.open-meteo.com/v1/forecast` +
        `?latitude=${CONFIG.latitude}` +
        `&longitude=${CONFIG.longitude}` +
        `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day` +
        `&hourly=temperature_2m,weather_code,is_day` +
        `&daily=temperature_2m_max,temperature_2m_min` +
        `&timezone=Asia%2FSeoul` +
        `&forecast_days=2`;

    try{
        const response = await fetch(url);

        if(!response.ok){
            throw new Error("Weather API Error");
        }

        const data = await response.json();
        const current = data.current;

        document.getElementById("city").textContent = CONFIG.city;
        document.getElementById("temp").textContent = round(current.temperature_2m);
        document.getElementById("condition").textContent = WEATHER_TEXT[current.weather_code] || "날씨";
        document.getElementById("currentIcon").innerHTML = iconSvg(current.weather_code, current.is_day);

        document.getElementById("high").textContent = round(data.daily.temperature_2m_max[0]);
        document.getElementById("low").textContent = round(data.daily.temperature_2m_min[0]);

        document.getElementById("feels").textContent = round(current.apparent_temperature);
        document.getElementById("humidity").textContent = round(current.relative_humidity_2m);
        document.getElementById("wind").textContent = round(current.wind_speed_10m);

        const now = new Date();
        const period = now.getHours() < 12 ? "오전" : "오후";
        const hour12 = ((now.getHours() + 11) % 12) + 1;
        document.getElementById("updated").textContent = `${period} ${hour12}시`;

        const currentHour = new Date();
        currentHour.setMinutes(0,0,0);

        let startIndex = data.hourly.time.findIndex(
            time => new Date(time) >= currentHour
        );

        if(startIndex < 0){
            startIndex = 0;
        }

        const hourly = document.getElementById("hourly");
        hourly.innerHTML = "";

        const fragment = document.createDocumentFragment();

        for(let i = 0; i < 6; i++){
            const index = startIndex + i;
            if(index >= data.hourly.time.length) break;

            const item = document.createElement("div");
            item.className = "hour";

            const label = i === 0 ? "지금" : hourText(data.hourly.time[index]);

            item.innerHTML = `
                <div class="hour-time">${label}</div>
                <div class="hour-icon">
                    ${iconSvg(
                        data.hourly.weather_code[index],
                        data.hourly.is_day[index]
                    )}
                </div>
                <div class="hour-temp">
                    ${round(data.hourly.temperature_2m[index])}°
                </div>
            `;

            fragment.appendChild(item);
        }

        hourly.appendChild(fragment);

        document.getElementById("error").style.display = "none";
    }
    catch(error){
        console.error(error);
        document.getElementById("error").style.display = "block";
    }
}

loadWeather();
setInterval(loadWeather, 30 * 60 * 1000);
</script>

</body>
</html>
