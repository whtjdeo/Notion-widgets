<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Glass Weather Widget</title>

<style>
:root{
  --glass: rgba(45, 52, 64, .56);
  --glass-border: rgba(255,255,255,.16);
  --text: rgba(255,255,255,.98);
  --sub: rgba(255,255,255,.72);
  --muted: rgba(255,255,255,.54);
}

*{
  box-sizing:border-box;
}

html, body{
  margin:0;
  width:100%;
  height:100%;
  background:transparent;
  overflow:hidden;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI",
              "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}

.widget{
  width:min(760px, 100%);
  padding:18px 22px 16px;
  color:var(--text);

  background:
    linear-gradient(
      145deg,
      rgba(78,86,103,.58),
      rgba(44,51,63,.50)
    );

  border:1px solid var(--glass-border);
  border-radius:28px;

  backdrop-filter: blur(22px) saturate(125%);
  -webkit-backdrop-filter: blur(22px) saturate(125%);

  box-shadow:
    0 14px 34px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.09);
}

.top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:24px;
}

.left{
  min-width:150px;
}

.location-line{
  display:flex;
  align-items:center;
  gap:7px;
  height:18px;
}

.location-arrow{
  width:14px;
  height:14px;
  fill:rgba(255,255,255,.88);
}

.city{
  font-size:12px;
  color:var(--sub);
  font-weight:600;
}

.current-temp{
  margin-top:4px;
  font-size:64px;
  line-height:.96;
  font-weight:300;
  letter-spacing:-3.5px;
}

.updated{
  margin-top:7px;
  font-size:11px;
  color:var(--muted);
}

.right{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  padding-top:1px;
}

.current-icon{
  width:40px;
  height:40px;
}

.condition{
  margin-top:3px;
  font-size:14px;
  color:var(--sub);
  font-weight:600;
}

.highlow{
  margin-top:3px;
  font-size:14px;
  font-weight:600;
}

.hourly{
  margin-top:14px;
  display:grid;
  grid-template-columns:repeat(6, 1fr);
  gap:4px;
}

.hour{
  text-align:center;
  min-width:0;
}

.hour-time{
  font-size:11px;
  color:var(--sub);
  white-space:nowrap;
}

.hour-icon{
  width:28px;
  height:28px;
  margin:6px auto 3px;
}

.hour-temp{
  font-size:13px;
  font-weight:700;
}

.bottom{
  margin-top:12px;
  padding-top:10px;
  border-top:1px solid rgba(255,255,255,.12);
  display:flex;
  justify-content:space-between;
  gap:16px;
  font-size:11px;
  color:var(--muted);
}

.bottom strong{
  color:var(--sub);
  font-weight:600;
}

svg{
  display:block;
}

#error{
  display:none;
  margin-top:10px;
  font-size:11px;
  color:#ffd4d4;
  text-align:center;
}

@media(max-width:580px){
  body{
    padding:6px;
  }

  .widget{
    padding:16px 16px 14px;
    border-radius:24px;
  }

  .current-temp{
    font-size:56px;
  }

  .hourly{
    gap:2px;
  }

  .hour-time{
    font-size:10px;
  }

  .hour-icon{
    width:24px;
    height:24px;
  }

  .hour-temp{
    font-size:12px;
  }

  .bottom{
    gap:8px;
    font-size:10px;
  }
}
</style>
</head>

<body>

<div class="widget">
  <div class="top">
    <div class="left">
      <div class="location-line">
        <svg class="location-arrow" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.4 3.6 4.7 9.7c-1.3.5-1.3 2.3.1 2.8l5.5 1.9 1.9 5.5c.5 1.4 2.3 1.4 2.8.1L21 4.4c.2-.6-.4-1.2-1-.8Z"/>
        </svg>
        <span class="city" id="city">대전</span>
      </div>

      <div class="current-temp"><span id="temp">--</span>°</div>
      <div class="updated" id="updated">날씨 불러오는 중...</div>
    </div>

    <div class="right">
      <div id="currentIcon" class="current-icon"></div>
      <div class="condition" id="condition">--</div>
      <div class="highlow">
        최고:<span id="high">--</span>° 최저:<span id="low">--</span>°
      </div>
    </div>
  </div>

  <div class="hourly" id="hourly"></div>

  <div class="bottom">
    <span>체감 <strong><span id="feels">--</span>°</strong></span>
    <span>습도 <strong><span id="humidity">--</span>%</strong></span>
    <span>바람 <strong><span id="wind">--</span> km/h</strong></span>
  </div>

  <div id="error">날씨 정보를 불러오지 못했습니다.</div>
</div>

<script>
const CONFIG = {
  city: "대전",
  latitude: 36.3504,
  longitude: 127.3845
};

const WEATHER_TEXT = {
  0:"맑음",
  1:"대체로 맑음",
  2:"구름 조금",
  3:"흐림",
  45:"안개",
  48:"짙은 안개",
  51:"약한 이슬비",
  53:"이슬비",
  55:"강한 이슬비",
  61:"약한 비",
  63:"비",
  65:"강한 비",
  71:"약한 눈",
  73:"눈",
  75:"강한 눈",
  77:"싸락눈",
  80:"약한 소나기",
  81:"소나기",
  82:"강한 소나기",
  85:"약한 눈소나기",
  86:"강한 눈소나기",
  95:"뇌우",
  96:"우박 동반 뇌우",
  99:"강한 우박 동반 뇌우"
};

function iconSvg(code, size="100%"){
  const sun = `
    <svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true">
      <g fill="none" stroke="white" stroke-width="4" stroke-linecap="round">
        <circle cx="32" cy="32" r="10" fill="white" stroke="none"/>
        <path d="M32 6v8M32 50v8M6 32h8M50 32h8M13.6 13.6l5.7 5.7M44.7 44.7l5.7 5.7M50.4 13.6l-5.7 5.7M19.3 44.7l-5.7 5.7"/>
      </g>
    </svg>`;

  const cloud = `
    <svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true">
      <path fill="white" d="M21 50h26c7.2 0 13-5.3 13-11.8 0-6-5-10.9-11.4-11.7C46.2 19.2 39.3 14 31.3 14c-9.3 0-17 6.9-17.8 15.7C7.2 30.7 3 35 3 40.4 3 45.7 7.8 50 14 50h7Z"/>
    </svg>`;

  const partly = `
    <svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true">
      <g fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round">
        <circle cx="24" cy="22" r="8" fill="white" stroke="none"/>
        <path d="M24 5v6M24 33v6M7 22h6M35 22h6M12 10l4 4M32 30l4 4M36 10l-4 4"/>
      </g>
      <path fill="white" d="M22 51h24c6.6 0 12-4.8 12-10.8 0-5.5-4.5-10-10.4-10.8C45.5 23 39.3 19 32.2 19c-8.2 0-15 6-15.7 13.8C10.8 33.7 7 37.5 7 42.3 7 47.1 11.4 51 17 51h5Z"/>
    </svg>`;

  const rain = `
    <svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true">
      <path fill="white" d="M19 40h27c6.6 0 12-4.8 12-10.8 0-5.5-4.5-10-10.4-10.8C45.5 12 39.3 8 32.2 8c-8.2 0-15 6-15.7 13.8C10.8 22.7 7 26.5 7 31.3 7 36.1 11.4 40 17 40h2Z"/>
      <g stroke="white" stroke-width="4" stroke-linecap="round">
        <path d="M20 48l-3 7M33 48l-3 7M46 48l-3 7"/>
      </g>
    </svg>`;

  const snow = `
    <svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true">
      <path fill="white" d="M19 38h27c6.6 0 12-4.8 12-10.8 0-5.5-4.5-10-10.4-10.8C45.5 10 39.3 6 32.2 6c-8.2 0-15 6-15.7 13.8C10.8 20.7 7 24.5 7 29.3 7 34.1 11.4 38 17 38h2Z"/>
      <g fill="white">
        <circle cx="20" cy="50" r="2.5"/>
        <circle cx="32" cy="55" r="2.5"/>
        <circle cx="45" cy="49" r="2.5"/>
      </g>
    </svg>`;

  const fog = `
    <svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true">
      <path fill="white" d="M19 35h27c6.6 0 12-4.8 12-10.8 0-5.5-4.5-10-10.4-10.8C45.5 7 39.3 3 32.2 3c-8.2 0-15 6-15.7 13.8C10.8 17.7 7 21.5 7 26.3 7 31.1 11.4 35 17 35h2Z"/>
      <g stroke="white" stroke-width="3" stroke-linecap="round" opacity=".9">
        <path d="M10 45h44M15 53h34"/>
      </g>
    </svg>`;

  const storm = `
    <svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true">
      <path fill="white" d="M19 37h27c6.6 0 12-4.8 12-10.8 0-5.5-4.5-10-10.4-10.8C45.5 9 39.3 5 32.2 5c-8.2 0-15 6-15.7 13.8C10.8 19.7 7 23.5 7 28.3 7 33.1 11.4 37 17 37h2Z"/>
      <path fill="white" d="M31 42h9l-7 9h7L27 61l4-9h-7l7-10Z"/>
    </svg>`;

  if(code === 0) return sun;
  if(code === 1 || code === 2) return partly;
  if(code === 3) return cloud;
  if(code === 45 || code === 48) return fog;
  if([51,53,55,61,63,65,80,81,82].includes(code)) return rain;
  if([71,73,75,77,85,86].includes(code)) return snow;
  if([95,96,99].includes(code)) return storm;

  return cloud;
}

function round(v){
  return Math.round(Number(v));
}

function hourText(iso){
  const d = new Date(iso);
  const h = d.getHours();

  if(h === 0) return "오전 12시";
  if(h < 12) return `오전 ${h}시`;
  if(h === 12) return "오후 12시";

  return `오후 ${h - 12}시`;
}

async function loadWeather(){
  const url =
    `https://api.open-meteo.com/v1/forecast` +
    `?latitude=${CONFIG.latitude}` +
    `&longitude=${CONFIG.longitude}` +
    `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m` +
    `&hourly=temperature_2m,weather_code` +
    `&daily=temperature_2m_max,temperature_2m_min` +
    `&timezone=Asia%2FSeoul` +
    `&forecast_days=2`;

  try{
    const res = await fetch(url);

    if(!res.ok){
      throw new Error("fetch failed");
    }

    const data = await res.json();
    const cur = data.current;

    document.getElementById("city").textContent = CONFIG.city;
    document.getElementById("temp").textContent =
      round(cur.temperature_2m);

    document.getElementById("condition").textContent =
      WEATHER_TEXT[cur.weather_code] || "날씨";

    document.getElementById("currentIcon").innerHTML =
      iconSvg(cur.weather_code);

    document.getElementById("high").textContent =
      round(data.daily.temperature_2m_max[0]);

    document.getElementById("low").textContent =
      round(data.daily.temperature_2m_min[0]);

    document.getElementById("feels").textContent =
      round(cur.apparent_temperature);

    document.getElementById("humidity").textContent =
      round(cur.relative_humidity_2m);

    document.getElementById("wind").textContent =
      round(cur.wind_speed_10m);

    const now = new Date();

    document.getElementById("updated").textContent =
      `${now.getHours() < 12 ? "오전" : "오후"} ${((now.getHours()+11)%12)+1}시`;

    const hourStart = new Date();
    hourStart.setMinutes(0,0,0);

    let startIndex = data.hourly.time.findIndex(
      t => new Date(t) >= hourStart
    );

    if(startIndex < 0){
      startIndex = 0;
    }

    const hourly = document.getElementById("hourly");
    hourly.innerHTML = "";

    for(let i = 0; i < 6; i++){
      const idx = startIndex + i;

      if(idx >= data.hourly.time.length){
        break;
      }

      const el = document.createElement("div");
      el.className = "hour";

      el.innerHTML = `
        <div class="hour-time">
          ${i === 0 ? "지금" : hourText(data.hourly.time[idx])}
        </div>

        <div class="hour-icon">
          ${iconSvg(data.hourly.weather_code[idx])}
        </div>

        <div class="hour-temp">
          ${round(data.hourly.temperature_2m[idx])}°
        </div>
      `;

      hourly.appendChild(el);
    }

    document.getElementById("error").style.display = "none";

  }catch(e){
    document.getElementById("error").style.display = "block";
  }
}

loadWeather();

setInterval(
  loadWeather,
  30 * 60 * 1000
);
</script>

</body>
</html>
