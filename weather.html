<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">

<title>Weather Widget</title>

<style>
:root {
    --notion-bg: #191919;

    --glass-top: rgba(255, 255, 255, 0.14);
    --glass-bottom: rgba(255, 255, 255, 0.075);
    --glass-border: rgba(255, 255, 255, 0.12);

    --text-main: rgba(255, 255, 255, 0.97);
    --text-sub: rgba(255, 255, 255, 0.72);
    --text-muted: rgba(255, 255, 255, 0.48);

    --sun: #ffc21c;
    --moon: #f5f6ff;
}

* {
    box-sizing: border-box;
}

html {
    margin: 0;
    width: 100%;
    height: 100%;

    /*
       노션 다크모드 바깥 배경과 동일하게 맞춤.
       iframe이 투명을 흰색으로 표시하더라도
       흰 사각형이 생기지 않도록 함.
    */
    background: var(--notion-bg);

    color-scheme: dark;

    overflow: hidden;
}

body {
    margin: 0;

    width: 100%;
    height: 100%;

    background: transparent;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 6px;

    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
}


/* ================================
   위젯
================================ */

.widget {
    width: min(760px, 100%);

    padding: 19px 22px 15px;

    color: var(--text-main);

    background:
        linear-gradient(
            145deg,
            var(--glass-top),
            var(--glass-bottom)
        );

    border: 1px solid var(--glass-border);

    border-radius: 27px;

    /*
       blur/backdrop-filter를 일부러 쓰지 않음.
       GPU 부하를 줄이면서 반투명 글래스 느낌만 유지.
    */

    box-shadow:
        0 6px 16px rgba(0, 0, 0, 0.20);

    contain: layout paint style;
}


/* ================================
   상단
================================ */

.top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;

    gap: 20px;
}


/* 왼쪽 */

.left {
    min-width: 155px;
}

.location {
    display: flex;
    align-items: center;

    gap: 6px;

    color: var(--text-sub);

    font-size: 12px;
    font-weight: 600;
}

.location svg {
    width: 13px;
    height: 13px;

    fill: currentColor;
}

.current-temp {
    margin-top: 4px;

    font-size: 66px;
    font-weight: 300;

    line-height: 0.95;

    letter-spacing: -4px;
}

.updated {
    margin-top: 7px;

    color: var(--text-muted);

    font-size: 11px;
}


/* 오른쪽 */

.right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
}

.current-icon {
    width: 54px;
    height: 54px;
}

.condition {
    margin-top: 2px;

    color: var(--text-sub);

    font-size: 15px;
    font-weight: 600;
}

.high-low {
    margin-top: 3px;

    font-size: 14px;
    font-weight: 600;
}


/* ================================
   시간대별 날씨
================================ */

.hourly {
    display: grid;

    grid-template-columns: repeat(6, 1fr);

    gap: 3px;

    margin-top: 17px;
}

.hour {
    min-width: 0;

    text-align: center;
}

.hour-time {
    color: var(--text-sub);

    font-size: 11px;

    white-space: nowrap;
}

.hour-icon {
    width: 34px;
    height: 34px;

    margin: 6px auto 3px;
}

.hour-temp {
    font-size: 13px;
    font-weight: 700;
}


/* ================================
   하단
================================ */

.bottom {
    display: flex;
    justify-content: space-between;

    gap: 10px;

    margin-top: 14px;

    padding-top: 10px;

    border-top:
        1px solid
        rgba(255, 255, 255, 0.10);

    color: var(--text-muted);

    font-size: 11px;
}

.bottom strong {
    color: var(--text-sub);

    font-weight: 600;
}


/* ================================
   SVG
================================ */

svg {
    display: block;
}


/* ================================
   오류
================================ */

#error {
    display: none;

    margin-top: 9px;

    color: #ffd3d3;

    font-size: 11px;

    text-align: center;
}


/* ================================
   작은 화면
================================ */

@media (max-width: 580px) {

    body {
        padding: 4px;
    }

    .widget {
        padding: 16px 15px 13px;

        border-radius: 23px;
    }

    .current-temp {
        font-size: 55px;
    }

    .current-icon {
        width: 45px;
        height: 45px;
    }

    .hour-time {
        font-size: 10px;
    }

    .hour-icon {
        width: 29px;
        height: 29px;
    }

    .hour-temp {
        font-size: 12px;
    }

    .bottom {
        font-size: 10px;
    }
}
</style>
</head>


<body>

<div class="widget">

    <div class="top">

        <div class="left">

            <div class="location">

                <svg viewBox="0 0 24 24">
                    <path d="
                        M20.4 3.6
                        4.7 9.7
                        c-1.3.5-1.3 2.3.1 2.8
                        l5.5 1.9
                        1.9 5.5
                        c.5 1.4 2.3 1.4 2.8.1
                        L21 4.4
                        c.2-.6-.4-1.2-1-.8Z
                    "/>
                </svg>

                <span id="city">
                    대전
                </span>

            </div>

            <div class="current-temp">
                <span id="temp">--</span>°
            </div>

            <div
                id="updated"
                class="updated">
                날씨 불러오는 중...
            </div>

        </div>


        <div class="right">

            <div
                id="currentIcon"
                class="current-icon">
            </div>

            <div
                id="condition"
                class="condition">
                --
            </div>

            <div class="high-low">

                최고:
                <span id="high">--</span>°

                최저:
                <span id="low">--</span>°

            </div>

        </div>

    </div>


    <div
        id="hourly"
        class="hourly">
    </div>


    <div class="bottom">

        <span>
            체감
            <strong>
                <span id="feels">--</span>°
            </strong>
        </span>

        <span>
            습도
            <strong>
                <span id="humidity">--</span>%
            </strong>
        </span>

        <span>
            바람
            <strong>
                <span id="wind">--</span> km/h
            </strong>
        </span>

    </div>


    <div id="error">
        날씨 정보를 불러오지 못했습니다.
    </div>

</div>


<script>

/* =========================================
   지역 설정
========================================= */

const CONFIG = {
    city: "대전",
    latitude: 36.3504,
    longitude: 127.3845
};


/* =========================================
   날씨 이름
========================================= */

const WEATHER_TEXT = {
    0: "맑음",
    1: "대체로 맑음",
    2: "구름 조금",
    3: "흐림",

    45: "안개",
    48: "짙은 안개",

    51: "약한 이슬비",
    53: "이슬비",
    55: "강한 이슬비",

    61: "약한 비",
    63: "비",
    65: "강한 비",

    71: "약한 눈",
    73: "눈",
    75: "강한 눈",
    77: "싸락눈",

    80: "약한 소나기",
    81: "소나기",
    82: "강한 소나기",

    85: "약한 눈소나기",
    86: "강한 눈소나기",

    95: "뇌우",
    96: "우박 동반 뇌우",
    99: "강한 우박 동반 뇌우"
};


/* =========================================
   날씨 아이콘
========================================= */

function iconSvg(
    code,
    isDay = 1
) {

    /* -------------------------
       해
    ------------------------- */

    const sun = `
        <svg viewBox="0 0 64 64">

            <circle
                cx="32"
                cy="32"
                r="17"
                fill="#ffc21c">
            </circle>

        </svg>
    `;


    /* -------------------------
       달
    ------------------------- */

    const moon = `
        <svg viewBox="0 0 64 64">

            <path
                fill="#f5f6ff"
                d="
                    M45 10
                    C34 12 25 21 25 33
                    C25 44 34 53 45 54
                    C36 59 24 56 17 48
                    C7 37 9 20 21 11
                    C28 6 37 6 45 10
                    Z
                ">
            </path>

        </svg>
    `;


    /* -------------------------
       구름
    ------------------------- */

    const cloud = `
        <svg viewBox="0 0 64 64">

            <g fill="#ffffff">

                <circle
                    cx="27"
                    cy="34"
                    r="15">
                </circle>

                <circle
                    cx="41"
                    cy="36"
                    r="12">
                </circle>

                <rect
                    x="18"
                    y="34"
                    width="34"
                    height="14"
                    rx="7">
                </rect>

            </g>

        </svg>
    `;


    /* -------------------------
       낮 + 구름
    ------------------------- */

    const partlyDay = `
        <svg viewBox="0 0 64 64">

            <circle
                cx="22"
                cy="22"
                r="14"
                fill="#ffc21c">
            </circle>

            <g fill="#ffffff">

                <circle
                    cx="31"
                    cy="37"
                    r="13">
                </circle>

                <circle
                    cx="44"
                    cy="39"
                    r="10">
                </circle>

                <rect
                    x="22"
                    y="37"
                    width="31"
                    height="13"
                    rx="6.5">
                </rect>

            </g>

        </svg>
    `;


    /* -------------------------
       밤 + 구름
    ------------------------- */

    const partlyNight = `
        <svg viewBox="0 0 64 64">

            <path
                fill="#f5f6ff"
                d="
                    M31 8
                    C22 11 17 18 17 26
                    C17 33 20 38 25 41
                    C22 36 21 32 22 28
                    C23 18 27 12 31 8
                    Z
                ">
            </path>

            <g fill="#ffffff">

                <circle
                    cx="34"
                    cy="38"
                    r="12">
                </circle>

                <circle
                    cx="46"
                    cy="40"
                    r="9">
                </circle>

                <rect
                    x="26"
                    y="38"
                    width="29"
                    height="12"
                    rx="6">
                </rect>

            </g>

        </svg>
    `;


    /* -------------------------
       비
    ------------------------- */

    const rain = `
        <svg viewBox="0 0 64 64">

            <g fill="#ffffff">

                <circle
                    cx="27"
                    cy="25"
                    r="14">
                </circle>

                <circle
                    cx="41"
                    cy="27"
                    r="11">
                </circle>

                <rect
                    x="19"
                    y="27"
                    width="32"
                    height="13"
                    rx="6.5">
                </rect>

            </g>

            <g
                stroke="#ffffff"
                stroke-width="4.5"
                stroke-linecap="round">

                <line
                    x1="20"
                    y1="47"
                    x2="15"
                    y2="54">
                </line>

                <line
                    x1="33"
                    y1="47"
                    x2="28"
                    y2="54">
                </line>

                <line
                    x1="46"
                    y1="47"
                    x2="41"
                    y2="54">
                </line>

            </g>

        </svg>
    `;


    /* -------------------------
       강한 비
    ------------------------- */

    const heavyRain = `
        <svg viewBox="0 0 64 64">

            <g
                stroke="#ffffff"
                stroke-width="5"
                stroke-linecap="round">

                <line
                    x1="15"
                    y1="18"
                    x2="9"
                    y2="26">
                </line>

                <line
                    x1="29"
                    y1="17"
                    x2="23"
                    y2="25">
                </line>

                <line
                    x1="43"
                    y1="20"
                    x2="37"
                    y2="28">
                </line>

                <line
                    x1="22"
                    y1="35"
                    x2="16"
                    y2="43">
                </line>

                <line
                    x1="36"
                    y1="34"
                    x2="30"
                    y2="42">
                </line>

                <line
                    x1="50"
                    y1="37"
                    x2="44"
                    y2="45">
                </line>

            </g>

        </svg>
    `;


    /* -------------------------
       안개
    ------------------------- */

    const fog = `
        <svg viewBox="0 0 64 64">

            <g
                stroke="#ffffff"
                stroke-width="5"
                stroke-linecap="round">

                <line
                    x1="10"
                    y1="22"
                    x2="48"
                    y2="22">
                </line>

                <line
                    x1="17"
                    y1="32"
                    x2="54"
                    y2="32">
                </line>

                <line
                    x1="9"
                    y1="42"
                    x2="45"
                    y2="42">
                </line>

            </g>

        </svg>
    `;


    /* -------------------------
       눈
    ------------------------- */

    const snow = `
        <svg viewBox="0 0 64 64">

            <g fill="#ffffff">

                <circle
                    cx="27"
                    cy="25"
                    r="14">
                </circle>

                <circle
                    cx="41"
                    cy="27"
                    r="11">
                </circle>

                <rect
                    x="19"
                    y="27"
                    width="32"
                    height="13"
                    rx="6.5">
                </rect>

            </g>

            <g fill="#ffffff">

                <circle
                    cx="20"
                    cy="50"
                    r="3">
                </circle>

                <circle
                    cx="32"
                    cy="55"
                    r="3">
                </circle>

                <circle
                    cx="45"
                    cy="49"
                    r="3">
                </circle>

            </g>

        </svg>
    `;


    /* -------------------------
       뇌우
    ------------------------- */

    const storm = `
        <svg viewBox="0 0 64 64">

            <g fill="#ffffff">

                <circle
                    cx="27"
                    cy="24"
                    r="14">
                </circle>

                <circle
                    cx="41"
                    cy="26"
                    r="11">
                </circle>

                <rect
                    x="19"
                    y="26"
                    width="32"
                    height="13"
                    rx="6.5">
                </rect>

            </g>

            <path
                fill="#ffc21c"
                d="
                    M34 38
                    H43
                    L35 48
                    H42
                    L27 61
                    L32 51
                    H25
                    Z
                ">
            </path>

        </svg>
    `;


    /* -------------------------
       코드별 선택
    ------------------------- */

    if (code === 0) {
        return isDay
            ? sun
            : moon;
    }

    if (
        code === 1 ||
        code === 2
    ) {
        return isDay
            ? partlyDay
            : partlyNight;
    }

    if (code === 3) {
        return cloud;
    }

    if (
        code === 45 ||
        code === 48
    ) {
        return fog;
    }

    if (
        [
            51,
            53,
            55,
            61,
            63
        ].includes(code)
    ) {
        return rain;
    }

    if (
        [
            65,
            80,
            81,
            82
        ].includes(code)
    ) {
        return heavyRain;
    }

    if (
        [
            71,
            73,
            75,
            77,
            85,
            86
        ].includes(code)
    ) {
        return snow;
    }

    if (
        [
            95,
            96,
            99
        ].includes(code)
    ) {
        return storm;
    }

    return cloud;
}


/* =========================================
   보조 함수
========================================= */

function round(value) {
    return Math.round(
        Number(value)
    );
}


function hourText(iso) {

    const date =
        new Date(iso);

    const hour =
        date.getHours();

    if (hour === 0) {
        return "오전 12시";
    }

    if (hour < 12) {
        return `오전 ${hour}시`;
    }

    if (hour === 12) {
        return "오후 12시";
    }

    return `오후 ${hour - 12}시`;
}


/* =========================================
   API 호출
========================================= */

async function loadWeather() {

    const url =
        `https://api.open-meteo.com/v1/forecast` +

        `?latitude=${CONFIG.latitude}` +

        `&longitude=${CONFIG.longitude}` +

        `&current=` +
        `temperature_2m,` +
        `apparent_temperature,` +
        `relative_humidity_2m,` +
        `weather_code,` +
        `wind_speed_10m,` +
        `is_day` +

        `&hourly=` +
        `temperature_2m,` +
        `weather_code,` +
        `is_day` +

        `&daily=` +
        `temperature_2m_max,` +
        `temperature_2m_min` +

        `&timezone=Asia%2FSeoul` +

        `&forecast_days=2`;


    try {

        const response =
            await fetch(url);


        if (!response.ok) {
            throw new Error(
                "Weather API error"
            );
        }


        const data =
            await response.json();


        const current =
            data.current;


        /* ======================
           현재 날씨
        ====================== */

        document
            .getElementById("city")
            .textContent =
            CONFIG.city;


        document
            .getElementById("temp")
            .textContent =
            round(
                current.temperature_2m
            );


        document
            .getElementById("condition")
            .textContent =
            WEATHER_TEXT[
                current.weather_code
            ] || "날씨";


        document
            .getElementById("currentIcon")
            .innerHTML =
            iconSvg(
                current.weather_code,
                current.is_day
            );


        document
            .getElementById("high")
            .textContent =
            round(
                data
                    .daily
                    .temperature_2m_max[0]
            );


        document
            .getElementById("low")
            .textContent =
            round(
                data
                    .daily
                    .temperature_2m_min[0]
            );


        document
            .getElementById("feels")
            .textContent =
            round(
                current
                    .apparent_temperature
            );


        document
            .getElementById("humidity")
            .textContent =
            round(
                current
                    .relative_humidity_2m
            );


        document
            .getElementById("wind")
            .textContent =
            round(
                current
                    .wind_speed_10m
            );


        /* ======================
           업데이트 시간
        ====================== */

        const now =
            new Date();


        const period =
            now.getHours() < 12
                ? "오전"
                : "오후";


        const hour12 =
            ((now.getHours() + 11) % 12)
            + 1;


        document
            .getElementById("updated")
            .textContent =
            `${period} ${hour12}시`;


        /* ======================
           시간대별 날씨
        ====================== */

        const hourStart =
            new Date();


        hourStart.setMinutes(
            0,
            0,
            0
        );


        let startIndex =
            data
                .hourly
                .time
                .findIndex(

                    time =>
                        new Date(time)
                        >= hourStart

                );


        if (startIndex < 0) {
            startIndex = 0;
        }


        const hourly =
            document
                .getElementById("hourly");


        hourly.innerHTML = "";


        const fragment =
            document.createDocumentFragment();


        for (
            let i = 0;
            i < 6;
            i++
        ) {

            const index =
                startIndex + i;


            if (
                index >=
                data.hourly.time.length
            ) {
                break;
            }


            const item =
                document
                    .createElement("div");


            item.className =
                "hour";


            item.innerHTML = `

                <div class="hour-time">
                    ${
                        i === 0
                            ? "지금"
                            : hourText(
                                data
                                    .hourly
                                    .time[index]
                            )
                    }
                </div>

                <div class="hour-icon">
                    ${
                        iconSvg(
                            data
                                .hourly
                                .weather_code[index],

                            data
                                .hourly
                                .is_day[index]
                        )
                    }
                </div>

                <div class="hour-temp">
                    ${
                        round(
                            data
                                .hourly
                                .temperature_2m[index]
                        )
                    }°
                </div>

            `;


            fragment.appendChild(
                item
            );
        }


        /*
           화면 갱신은 한 번만 수행
        */

        hourly.appendChild(
            fragment
        );


        document
            .getElementById("error")
            .style
            .display =
            "none";

    }

    catch (error) {

        document
            .getElementById("error")
            .style
            .display =
            "block";

    }
}


/* =========================================
   실행
========================================= */

loadWeather();


/*
   날씨는 자주 변하지 않으므로
   30분마다 한 번만 갱신
*/

setInterval(
    loadWeather,
    30 * 60 * 1000
);

</script>

</body>
</html>
