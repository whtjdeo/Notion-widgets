<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flip Clock</title>

<style>

:root {
    --card-bg: #202020;
    --card-text: #ffffff;

    --main-text: rgba(255,255,255,0.96);
    --sub-text: rgba(255,255,255,0.78);

    --card-width: 82px;
    --card-height: 86px;

    --card-radius: 9px;
    --gap: 15px;
}


/* =========================================
   기본
========================================= */

* {
    box-sizing: border-box;
}


html,
body {
    margin: 0;

    width: 100%;
    height: 100%;

    background: transparent !important;

    overflow: hidden;

    color-scheme: dark;
}


body {
    display: flex;

    justify-content: center;
    align-items: center;

    font-family:
        Georgia,
        "Times New Roman",
        serif;
}


/* =========================================
   전체 시계
========================================= */

.clock-wrap {

    width: max-content;

    max-width: 100%;

    padding: 12px 16px;

    text-align: center;

    background: transparent;
}


/* =========================================
   시계 행
========================================= */

.clock-row {

    display: flex;

    align-items: center;
    justify-content: center;

    gap: var(--gap);
}


.time-group {

    display: flex;

    align-items: center;

    gap: 10px;
}


/* =========================================
   콜론
========================================= */

.colon {

    margin: 0 -3px;

    transform: translateY(-2px);

    font-family:
        Arial,
        sans-serif;

    font-size: 43px;

    font-weight: 700;

    color: var(--main-text);
}


/* =========================================
   플립 카드
========================================= */

.flip-card {

    position: relative;

    width: var(--card-width);
    height: var(--card-height);

    border-radius: var(--card-radius);

    background: var(--card-bg);

    color: var(--card-text);

    overflow: hidden;

    perspective: 700px;

    box-shadow:
        0 7px 16px rgba(0,0,0,0.32);
}


/* AM / PM */

.flip-card.small {

    width: 42px;
    height: 42px;

    border-radius: 5px;

    align-self: flex-end;

    margin-bottom: 3px;
}


/* =========================================
   카드 위 / 아래
========================================= */

.half,
.flip {

    position: absolute;

    left: 0;

    width: 100%;
    height: 50%;

    overflow: hidden;

    background: var(--card-bg);
}


.top {

    top: 0;

    border-radius:
        var(--card-radius)
        var(--card-radius)
        0
        0;
}


.bottom {

    bottom: 0;

    border-radius:
        0
        0
        var(--card-radius)
        var(--card-radius);
}


/* =========================================
   숫자
========================================= */

.half::after,
.flip::after {

    content: attr(data-value);

    position: absolute;

    left: 0;

    width: 100%;

    text-align: center;

    font-family:
        Impact,
        Haettenschweiler,
        "Arial Narrow Bold",
        sans-serif;

    font-size: 58px;

    line-height: var(--card-height);

    letter-spacing: 1px;
}


.small .half::after,
.small .flip::after {

    font-size: 17px;

    line-height: 42px;

    letter-spacing: 0;
}


.top::after,
.flip.top::after {

    top: 0;
}


.bottom::after,
.flip.bottom::after {

    bottom: 0;
}


/* =========================================
   가운데 카드 구분선
========================================= */

.center-line {

    position: absolute;

    z-index: 5;

    top: 50%;
    left: 0;

    width: 100%;
    height: 1px;

    transform: translateY(-0.5px);

    background:
        rgba(255,255,255,0.08);

    box-shadow:
        0 1px 0
        rgba(0,0,0,0.65);

    pointer-events: none;
}


/* =========================================
   플립 애니메이션
========================================= */

.flip.top {

    z-index: 4;

    transform-origin: bottom;

    backface-visibility: hidden;
}


.flip.bottom {

    z-index: 3;

    transform-origin: top;

    transform: rotateX(90deg);

    backface-visibility: hidden;
}


.flip-card.animating .flip.top {

    animation:
        flipTop
        0.34s
        ease-in
        forwards;
}


.flip-card.animating .flip.bottom {

    animation:
        flipBottom
        0.34s
        0.34s
        ease-out
        forwards;
}


@keyframes flipTop {

    from {
        transform: rotateX(0deg);
    }

    to {
        transform: rotateX(-90deg);
    }

}


@keyframes flipBottom {

    from {
        transform: rotateX(90deg);
    }

    to {
        transform: rotateX(0deg);
    }

}


/* =========================================
   날짜
========================================= */

.date-row {

    margin-top: 8px;

    color: var(--main-text);

    font-size: 18px;

    font-weight: 700;

    letter-spacing: 0.4px;

    white-space: nowrap;

    text-shadow:
        0 2px 5px
        rgba(0,0,0,0.35);
}


.date-row .sep {

    display: inline-block;

    padding: 0 10px;

    color: var(--sub-text);
}


/* =========================================
   작은 화면
========================================= */

@media (max-width: 520px) {

    :root {

        --card-width: 66px;
        --card-height: 70px;

        --gap: 10px;
    }


    .half::after,
    .flip::after {

        font-size: 46px;

        line-height: 70px;
    }


    .colon {

        font-size: 35px;
    }


    .flip-card.small {

        width: 36px;
        height: 36px;
    }


    .small .half::after,
    .small .flip::after {

        font-size: 14px;

        line-height: 36px;
    }


    .date-row {

        font-size: 14px;
    }

}

</style>
</head>


<body>


<div class="clock-wrap">

    <div class="clock-row">

        <div class="time-group">


            <!-- 시 -->

            <div
                class="flip-card"
                id="hours">

                <div
                    class="half top"
                    data-value="12">
                </div>

                <div
                    class="half bottom"
                    data-value="12">
                </div>

                <div
                    class="flip top"
                    data-value="12">
                </div>

                <div
                    class="flip bottom"
                    data-value="12">
                </div>

                <div class="center-line">
                </div>

            </div>


            <div class="colon">
                :
            </div>


            <!-- 분 -->

            <div
                class="flip-card"
                id="minutes">

                <div
                    class="half top"
                    data-value="00">
                </div>

                <div
                    class="half bottom"
                    data-value="00">
                </div>

                <div
                    class="flip top"
                    data-value="00">
                </div>

                <div
                    class="flip bottom"
                    data-value="00">
                </div>

                <div class="center-line">
                </div>

            </div>


            <div class="colon">
                :
            </div>


            <!-- 초 -->

            <div
                class="flip-card"
                id="seconds">

                <div
                    class="half top"
                    data-value="00">
                </div>

                <div
                    class="half bottom"
                    data-value="00">
                </div>

                <div
                    class="flip top"
                    data-value="00">
                </div>

                <div
                    class="flip bottom"
                    data-value="00">
                </div>

                <div class="center-line">
                </div>

            </div>


            <!-- AM / PM -->

            <div
                class="flip-card small"
                id="ampm">

                <div
                    class="half top"
                    data-value="AM">
                </div>

                <div
                    class="half bottom"
                    data-value="AM">
                </div>

                <div
                    class="flip top"
                    data-value="AM">
                </div>

                <div
                    class="flip bottom"
                    data-value="AM">
                </div>

                <div class="center-line">
                </div>

            </div>


        </div>

    </div>


    <!-- 날짜 -->

    <div class="date-row">

        <span id="weekday">
            Friday
        </span>

        <span class="sep">
            |
        </span>

        <span id="date">
            October 2, 2026
        </span>

    </div>


</div>


<script>


/* =========================================
   두 자리 숫자
========================================= */

function pad2(number) {

    return String(number)
        .padStart(2, "0");

}


/* =========================================
   카드 값 변경
========================================= */

function setCardValue(
    card,
    newValue
) {

    const currentValue =
        card.dataset.value;


    /* 최초 실행 */

    if (
        currentValue === undefined
    ) {

        card.dataset.value =
            newValue;


        card
            .querySelectorAll(
                "[data-value]"
            )
            .forEach(

                element => {

                    element.dataset.value =
                        newValue;

                }

            );


        return;

    }


    /* 값이 같으면 아무것도 안 함 */

    if (
        currentValue === newValue
    ) {

        return;

    }


    const staticTop =
        card.querySelector(
            ".half.top"
        );


    const staticBottom =
        card.querySelector(
            ".half.bottom"
        );


    const flipTop =
        card.querySelector(
            ".flip.top"
        );


    const flipBottom =
        card.querySelector(
            ".flip.bottom"
        );


    /* 새 값 */

    staticTop.dataset.value =
        newValue;


    /* 기존 값 */

    flipTop.dataset.value =
        currentValue;


    /* 펼쳐질 새 값 */

    flipBottom.dataset.value =
        newValue;


    card.classList.remove(
        "animating"
    );


    /* 애니메이션 재시작 */

    void card.offsetWidth;


    card.classList.add(
        "animating"
    );


    /* 아래쪽 교체 */

    setTimeout(

        () => {

            staticBottom.dataset.value =
                newValue;

        },

        340

    );


    /* 애니메이션 종료 */

    setTimeout(

        () => {

            card.classList.remove(
                "animating"
            );


            staticTop.dataset.value =
                newValue;


            staticBottom.dataset.value =
                newValue;


            flipTop.dataset.value =
                newValue;


            flipBottom.dataset.value =
                newValue;


            card.dataset.value =
                newValue;

        },

        700

    );

}


/* =========================================
   현재 시간 갱신
========================================= */

function updateClock() {

    const now =
        new Date();


    let hours =
        now.getHours();


    const ampm =
        hours >= 12
            ? "PM"
            : "AM";


    hours =
        hours % 12;


    if (
        hours === 0
    ) {

        hours = 12;

    }


    const hh =
        pad2(hours);


    const mm =
        pad2(
            now.getMinutes()
        );


    const ss =
        pad2(
            now.getSeconds()
        );


    setCardValue(

        document.getElementById(
            "hours"
        ),

        hh

    );


    setCardValue(

        document.getElementById(
            "minutes"
        ),

        mm

    );


    setCardValue(

        document.getElementById(
            "seconds"
        ),

        ss

    );


    setCardValue(

        document.getElementById(
            "ampm"
        ),

        ampm

    );


    /* 요일 */

    const weekday =
        now.toLocaleDateString(

            "en-US",

            {
                weekday:
                    "long"
            }

        );


    /* 날짜 */

    const date =
        now.toLocaleDateString(

            "en-US",

            {
                month:
                    "long",

                day:
                    "numeric",

                year:
                    "numeric"
            }

        );


    document
        .getElementById(
            "weekday"
        )
        .textContent =
        weekday;


    document
        .getElementById(
            "date"
        )
        .textContent =
        date;

}


/* =========================================
   처음 실행
========================================= */

(function initialize() {

    const now =
        new Date();


    let hours =
        now.getHours();


    const ampm =
        hours >= 12
            ? "PM"
            : "AM";


    hours =
        hours % 12;


    if (
        hours === 0
    ) {

        hours = 12;

    }


    const values = {

        hours:
            pad2(hours),

        minutes:
            pad2(
                now.getMinutes()
            ),

        seconds:
            pad2(
                now.getSeconds()
            ),

        ampm:
            ampm

    };


    Object
        .entries(values)
        .forEach(

            ([id, value]) => {

                const card =
                    document
                    .getElementById(id);


                card.dataset.value =
                    value;


                card
                    .querySelectorAll(
                        "[data-value]"
                    )
                    .forEach(

                        element => {

                            element.dataset.value =
                                value;

                        }

                    );

            }

        );


    updateClock();


    /* 1초마다 갱신 */

    setInterval(

        updateClock,

        1000

    );

})();


</script>

</body>

</html>
